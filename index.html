<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudstone</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --line:#e3e3e6; --card:#fff; --accent:#2563eb; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --fg:#e8e8ea; --muted:#9a9aa0; --line:#2a2b2f; --card:#1a1b1e; --accent:#60a5fa; --err:#ff6b5b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:16px; }
  main { padding:16px; display:grid; gap:16px; align-content:start; min-width:0; }
  h1 { font-size:15px; margin:0 0 12px; }
  h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li button { all:unset; cursor:pointer; display:block; width:100%; padding:4px 6px; border-radius:4px; }
  li button:hover, li button:focus-visible { background:var(--line); }
  textarea { width:100%; min-height:90px; font:13px ui-monospace,monospace; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  button.primary { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 14px; cursor:pointer; }
  select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px; }
  .scroll { overflow:auto; max-height:420px; }
  table { border-collapse:collapse; font-size:12.5px; }
  th, td { border-bottom:1px solid var(--line); padding:4px 10px; text-align:left; white-space:nowrap; max-width:360px; overflow:hidden; text-overflow:ellipsis; }
  th { position:sticky; top:0; background:var(--card); }
  h2.side { margin:20px 0 0; }
  li .sub { display:block; color:var(--muted); font-size:11.5px; }
  .muted { color:var(--muted); font-size:12px; }
  .err { color:var(--err); white-space:pre-wrap; }
  input[type=text], input[type=password] { width:100%; margin-top:6px; padding:6px 8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; }
  button.plain { background:none; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.link { all:unset; cursor:pointer; color:var(--accent); }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--muted); font-size:12px; }
  form + form { margin-top:12px; }
  [hidden] { display:none !important; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  @media (max-width:700px) { body { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Cloudstone</h1>
  <form id="authform" hidden>
    <input id="username" type="text" autocomplete="username" placeholder="Username" aria-label="Username" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" aria-label="Password" required>
    <div class="row"><button class="primary" value="login">Log in</button><button class="plain" value="signup">Sign up</button></div>
    <div id="authmsg" class="muted"></div>
  </form>
  <div id="signedin" hidden>
    <span class="muted">Signed in as</span> <b id="who"></b> · <button class="link" id="logout">Log out</button>
    <details>
      <summary>Account</summary>
      <form id="pwform">
        <input id="oldpw" type="password" autocomplete="current-password" placeholder="Current password" aria-label="Current password" required>
        <input id="newpw" type="password" autocomplete="new-password" placeholder="New password" aria-label="New password" required>
        <div class="row"><button class="plain">Change password</button></div>
      </form>
      <form id="delform">
        <input id="delpw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password to delete account" required>
        <div class="row"><button class="plain">Delete account and data</button></div>
      </form>
      <div id="acctmsg" class="muted"></div>
    </details>
  </div>
  <h2 class="side">Upload</h2>
  <label class="muted"><span id="uphint"></span><br>
    <input id="file" type="file" accept=".csv,.json,.ndjson,.jsonl,.xlsx" multiple disabled>
  </label>
  <div id="upmsg" class="muted"></div>
  <h2 class="side">Demo data</h2>
  <ul id="demo"></ul>
  <h2 class="side">Your tables</h2>
  <ul id="tables"></ul>
  <h2 class="side">Example queries</h2>
  <ul id="examples"></ul>
</aside>
<main>
  <section>
    <h2 id="proftitle">Profile</h2>
    <div id="profile" class="scroll muted">Upload a file or pick a table.</div>
  </section>
  <section>
    <h2>Query</h2>
    <form id="askform" class="row" style="margin:0 0 10px">
      <input id="question" type="text" style="flex:1; margin:0" aria-label="Question in plain English"
        placeholder="Ask in plain English, e.g. Which sales rep sold the most speakers?">
      <button class="primary">Ask</button>
    </form>
    <div id="askmsg" class="muted" style="margin-bottom:8px"></div>
    <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM demo.sales LIMIT 100&#10;-- nested JSON: SELECT context.device, count(*) FROM demo.events GROUP BY 1"></textarea>
    <div class="row"><button class="primary" id="run">Run</button><span class="muted">Ctrl/⌘+Enter</span></div>
    <div id="qmsg" class="muted"></div>
    <div id="result" class="scroll"></div>
  </section>
  <section>
    <h2>Chart</h2>
    <div class="row">
      <select id="ctype"><option>bar</option><option>line</option><option>scatter</option></select>
      X <select id="cx"></select> Y <select id="cy"></select>
    </div>
    <canvas id="chart" height="110"></canvas>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let last = null, chart = null, user = null;
const ident = name => name.split('.').map(p => `"${p}"`).join('.');

const EXAMPLES = [
  ['Revenue by region', 'CSV', `SELECT region, round(sum(quantity * unit_price), 2) AS revenue
FROM demo.sales GROUP BY 1 ORDER BY 2 DESC`],
  ['Revenue by month', 'CSV', `SELECT strftime(order_date, '%Y-%m') AS month, round(sum(quantity * unit_price), 2) AS revenue
FROM demo.sales GROUP BY 1 ORDER BY 1`],
  ['Events by device', 'NDJSON · nested object', `SELECT context.device, count(*) AS events
FROM demo.events GROUP BY 1 ORDER BY 2 DESC`],
  ['Units purchased per SKU', 'NDJSON · unnest array', `SELECT item.sku, sum(item.qty) AS units
FROM demo.events, unnest(items) AS t(item)
WHERE type = 'purchase' GROUP BY 1 ORDER BY 2 DESC`],
  ['Stock by product variant', 'JSON · array of objects', `SELECT name, v.color, v.stock
FROM demo.products, unnest(variants) AS t(v) ORDER BY v.stock`],
  ['Revenue per sales rep', 'XLSX ⋈ CSV join', `SELECT e.name, e.region, round(sum(s.quantity * s.unit_price), 2) AS revenue
FROM demo.sales s JOIN demo.employees e ON s.rep_id = e.employee_id
GROUP BY 1, 2 ORDER BY 3 DESC`],
];

function listItem(label, sub, onclick) {
  const li = document.createElement('li'), b = document.createElement('button');
  b.textContent = label;
  if (sub) b.appendChild(Object.assign(document.createElement('span'), {className: 'sub', textContent: sub}));
  b.onclick = onclick;
  li.appendChild(b);
  return li;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}

function renderTable(el, {columns, rows}) {
  const t = document.createElement('table');
  const head = t.createTHead().insertRow();
  columns.forEach(c => head.appendChild(document.createElement('th')).textContent = c);
  const body = t.createTBody();
  rows.forEach(r => {
    const tr = body.insertRow();
    r.forEach(v => {
      const td = tr.insertCell();
      td.textContent = v === null ? '∅' : typeof v === 'object' ? JSON.stringify(v) : v;
      td.title = td.textContent;
    });
  });
  el.replaceChildren(t);
  el.classList.remove('muted');
}

async function loadTables() {
  const names = await api('/tables');
  const item = n => listItem(n, '', () => showProfile(n));
  $('demo').replaceChildren(...names.filter(n => n.startsWith('demo.')).map(item));
  const mine = names.filter(n => !n.startsWith('demo.'));
  $('tables').replaceChildren(...(mine.length ? mine.map(item)
    : [Object.assign(document.createElement('li'), {className: 'muted', textContent: user ? 'None yet. Upload a file.' : 'Log in to save your own tables.'})]));
}

function say(el, text, isErr) {
  el.className = isErr ? 'err' : 'muted';
  el.textContent = text;
}

function setUser(u) {
  user = u;
  $('authform').hidden = !!u;
  $('signedin').hidden = !u;
  $('who').textContent = u || '';
  $('file').disabled = !u;
  $('uphint').textContent = u ? 'CSV, JSON, NDJSON or XLSX. Saved to your account.' : 'Log in to upload and save your own data.';
  for (const f of document.querySelectorAll('form')) f.reset();
  return loadTables();
}

const post = (path, data) => api(path, {method: 'POST', body: JSON.stringify(data)});

$('authform').onsubmit = async e => {
  e.preventDefault();
  try {
    const j = await post('/' + e.submitter.value, {username: $('username').value, password: $('password').value});
    say($('authmsg'), '');
    await setUser(j.user);
  } catch (err) { say($('authmsg'), err.message, true); }
};

$('logout').onclick = async () => setUser((await post('/logout', {})).user);

$('pwform').onsubmit = async e => {
  e.preventDefault();
  try {
    await post('/password', {old: $('oldpw').value, new: $('newpw').value});
    e.target.reset();
    say($('acctmsg'), 'Password changed. Other sessions were logged out.');
  } catch (err) { say($('acctmsg'), err.message, true); }
};

$('delform').onsubmit = async e => {
  e.preventDefault();
  if (!confirm(`Delete account "${user}" and all its tables? This can't be undone.`)) return;
  try {
    await setUser((await post('/account/delete', {password: $('delpw').value})).user);
    say($('upmsg'), 'Account deleted.');
  } catch (err) { say($('acctmsg'), err.message, true); }
};

async function showProfile(name, prof) {
  $('proftitle').textContent = `Profile · ${name}`;
  renderTable($('profile'), prof || await api('/profile?table=' + encodeURIComponent(name)));
  $('sql').value = `SELECT * FROM ${ident(name)} LIMIT 100`;
  run();
}

$('file').onchange = async e => {
  for (const f of e.target.files) {
    $('upmsg').textContent = `Loading ${f.name}…`;
    try {
      const j = await api('/upload?name=' + encodeURIComponent(f.name), {method: 'POST', body: f});
      $('upmsg').textContent = `Loaded ${f.name} → ${j.table}`;
      await loadTables();
      await showProfile(j.table, j.profile);
    } catch (err) {
      $('upmsg').innerHTML = '';
      $('upmsg').appendChild(Object.assign(document.createElement('div'), {className: 'err', textContent: err.message}));
    }
  }
  e.target.value = '';
};

async function run() {
  $('qmsg').className = 'muted';
  $('qmsg').textContent = 'Running…';
  const t0 = performance.now();
  try {
    showResult(await api('/query', {method: 'POST', body: JSON.stringify({sql: $('sql').value})}), t0);
    loadTables();
  } catch (err) {
    say($('qmsg'), err.message, true);
  }
}

function showResult(r, t0) {
  last = r;
  say($('qmsg'), `${r.rows.length}${r.truncated ? '+ (showing first 1000)' : ''} rows · ${Math.round(performance.now() - t0)} ms`);
  renderTable($('result'), r);
  for (const s of [$('cx'), $('cy')]) s.replaceChildren(...r.columns.map((c, i) => new Option(c, i)));
  if (r.columns.length > 1) $('cy').value = 1;
  drawChart();
}

$('askform').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  say($('askmsg'), 'Asking Claude…');
  const t0 = performance.now();
  try {
    const j = await post('/ask', {question: $('question').value});
    $('sql').value = j.sql;
    say($('askmsg'), j.explanation + (j.sql ? ' The SQL is below; edit it and press Run to refine.' : ''));
    if (j.error) say($('qmsg'), j.error, true);
    else if (j.sql) showResult(j, t0);
  } catch (err) {
    say($('askmsg'), err.message, true);
  } finally {
    btn.disabled = false;
  }
};

function drawChart() {
  chart?.destroy();
  if (!last?.rows.length) return;
  const x = +$('cx').value, y = +$('cy').value, type = $('ctype').value;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const data = type === 'scatter'
    ? {datasets: [{label: last.columns[y], data: last.rows.map(r => ({x: +r[x], y: +r[y]})), backgroundColor: accent}]}
    : {labels: last.rows.map(r => r[x]), datasets: [{label: last.columns[y], data: last.rows.map(r => +r[y]), backgroundColor: accent, borderColor: accent}]};
  chart = new Chart($('chart'), {type, data, options: {plugins: {legend: {display: false}}}});
}

$('run').onclick = run;
$('sql').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); };
for (const id of ['ctype', 'cx', 'cy']) $(id).onchange = drawChart;
$('examples').replaceChildren(...EXAMPLES.map(([label, sub, sql]) => listItem(label, sub, () => { $('sql').value = sql; run(); })));
api('/me').then(j => { $('askform').hidden = $('askmsg').hidden = !j.ask; return setUser(j.user); }).then(() => showProfile('demo.sales'));
</script>
</body>
</html>
